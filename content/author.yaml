name: Justin Smith
bio: >-
  Fullstack engineer with experience across frontend, backend, and data pipeline
  development. Currently building open-source integration SDKs and connectors at
  scale at Estuary, with a track record of shipping production systems — from
  edge computing and real-time streaming to fault-tolerant data pipelines
  powering ML workflows. Previously led data infrastructure at Camgian,
  including securing an $8M U.S. Army contract and processing 13–20M events/day
  from 2,900+ industrial assets. Active adopter of AI tooling to accelerate
  development workflows. B.S. Software Engineering from Mississippi State
  University, Cum Laude.
